apiVersion: apps/v1
kind: Deployment

metadata:
  name: cicd-dashboard

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: cicd-dashboard

  template:
    metadata:
      labels:
        app: cicd-dashboard

    spec:
      containers:
      - name: dashboard
        image: nikitabalwada/cicd-dashboard:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 5000